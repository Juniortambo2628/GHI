name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test-and-fix.yml

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo, pdo_mysql, bcmath, gd, fileinfo
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate release tarball
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RELEASE_NAME="release-${SHORT_SHA}-${TIMESTAMP}"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV

          tar czf "/tmp/${RELEASE_NAME}.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/app/public/*' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='archived' \
            --exclude='*.json.bak' \
            --exclude='new-session-*.json' \
            .

          echo "Tarball created:"
          ls -lh "/tmp/${RELEASE_NAME}.tar.gz"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload tarball to server
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} \
            -i ~/.ssh/deploy_key \
            "/tmp/${RELEASE_NAME}.tar.gz" \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

      - name: Deploy on server
        env:
          SSH_CMD: "ssh -p ${{ secrets.SSH_PORT || 22 }} -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          DEPLOY_BASE: ${{ secrets.DEPLOY_BASE }}
        run: |
          eval $SSH_CMD << 'DEPLOY_SCRIPT'
          set -euo pipefail

          RELEASE_NAME="${{ env.RELEASE_NAME }}"
          DEPLOY_BASE="${{ secrets.DEPLOY_BASE }}"
          RELEASE_DIR="${DEPLOY_BASE}/GHI-releases/${RELEASE_NAME}"
          CORE_LINK="${DEPLOY_BASE}/GHI-core"
          SHARED_DIR="${DEPLOY_BASE}/GHI-shared"

          echo "==> Creating release directory..."
          mkdir -p "${RELEASE_DIR}"
          mkdir -p "${DEPLOY_BASE}/GHI-releases"

          echo "==> Extracting release..."
          tar xzf "/tmp/${RELEASE_NAME}.tar.gz" -C "${RELEASE_DIR}"

          echo "==> Symlinking shared resources..."
          ln -sfn "${SHARED_DIR}/.env" "${RELEASE_DIR}/.env"
          mkdir -p "${RELEASE_DIR}/storage/framework/cache"
          mkdir -p "${RELEASE_DIR}/storage/framework/sessions"
          mkdir -p "${RELEASE_DIR}/storage/framework/views"
          rm -rf "${RELEASE_DIR}/storage/app" "${RELEASE_DIR}/storage/logs"
          ln -sfn "${SHARED_DIR}/storage/app" "${RELEASE_DIR}/storage/app"
          ln -sfn "${SHARED_DIR}/storage/logs" "${RELEASE_DIR}/storage/logs"

          echo "==> Installing composer dependencies..."
          cd "${RELEASE_DIR}"
          composer install --no-dev --optimize-autoloader --prefer-dist --no-progress --no-interaction --ignore-platform-reqs

          echo "==> Setting permissions (shared hosting: 777 for writable dirs)..."
          chmod -R 777 "${RELEASE_DIR}/storage" 2>/dev/null || true
          chmod -R 777 "${RELEASE_DIR}/bootstrap/cache" 2>/dev/null || true

          echo "==> Running artisan commands..."
          if grep -q '^APP_KEY=$' .env 2>/dev/null || ! grep -q '^APP_KEY=' .env 2>/dev/null; then
            echo "APP_KEY is empty or missing — generating..."
            php artisan key:generate
          else
            echo "APP_KEY already set — skipping generation."
          fi
          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "==> Swapping to new release..."
          rm -rf "${CORE_LINK}"
          ln -sfn "${RELEASE_DIR}" "${CORE_LINK}"
          ls -la "${CORE_LINK}/public/index.php" || { echo "FATAL: GHI-core symlink failed"; exit 1; }

          echo "==> Ensuring public_html/api symlink..."
          rm -rf "${DEPLOY_BASE}/public_html/api"
          ln -sfn "${CORE_LINK}/public" "${DEPLOY_BASE}/public_html/api"

          echo "==> Writing public_html/.htaccess..."
          printf '%s\n' \
            'Options +FollowSymLinks -Indexes' \
            'RewriteEngine On' \
            'RewriteBase /' \
            'RewriteCond %{REQUEST_URI} ^/\.well-known/' \
            'RewriteRule ^ - [L]' \
            'RewriteCond %{REQUEST_FILENAME} !-d' \
            'RewriteCond %{REQUEST_FILENAME} !-f' \
            'RewriteCond %{REQUEST_URI} !^/api/' \
            'RewriteRule ^ api/index.php [L]' > "${DEPLOY_BASE}/public_html/.htaccess"

          echo "==> Writing public_html/index.php front controller..."
          cat > "${DEPLOY_BASE}/public_html/index.php" << 'FRONTCONTROLLER'
          <?php

          define('LARAVEL_START', microtime(true));

          require __DIR__.'/api/index.php';
          FRONTCONTROLLER

          echo "==> Cleaning old releases (keeping last 5)..."
          cd "${DEPLOY_BASE}/GHI-releases"
          ls -1dt */ | tail -n +6 | xargs rm -rf 2>/dev/null || true

          echo "==> Deploy complete!"
          DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Health check
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 15

          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://globalharmonyinitiative.com/up" || true)

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed (HTTP ${HTTP_STATUS})"
              exit 0
            fi
            echo "Attempt $i: HTTP ${HTTP_STATUS} — retrying in 5s..."
            sleep 5
          done

          echo "::error::Health check failed after 5 attempts (last HTTP ${HTTP_STATUS})"
          exit 1
