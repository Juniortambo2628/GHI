name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test-and-fix.yml

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo, pdo_mysql, bcmath, gd, fileinfo
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress --ignore-platform-reqs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Generate release tarball
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RELEASE_NAME="release-${TIMESTAMP}-${SHORT_SHA}"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV

          tar czf "/tmp/${RELEASE_NAME}.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage' \
            --exclude='archived' \
            --exclude='*.json.bak' \
            --exclude='new-session-*.json' \
            --exclude='.phpstan' \
            --exclude='.rector-cache' \
            --exclude='.php-cs-fixer.cache' \
            --exclude='test-output.txt' \
            --exclude='uploads' \
            --exclude='public/hot' \
            --exclude='public/storage' \
            .

          echo "Total files: $(tar tzf "/tmp/${RELEASE_NAME}.tar.gz" | wc -l)"
          echo "Tarball size: $(ls -lh /tmp/${RELEASE_NAME}.tar.gz | awk '{print $5}')"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload tarball to server
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} \
            -i ~/.ssh/deploy_key \
            "/tmp/${RELEASE_NAME}.tar.gz" \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

      - name: Deploy on server
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -s" << 'SERVER_DEPLOY'
          set -euo pipefail

          HOME_DIR="$(eval echo ~)"
          GHI_CORE="${HOME_DIR}/GHI-core"
          WEBROOT="${HOME_DIR}/public_html"
          RELEASE="${{ env.RELEASE_NAME }}"
          TMP="/tmp/ghi-extract"

          echo "============================================"
          echo "  GHI Deployment"
          echo "  Release: ${RELEASE}"
          echo "  Target:  ${GHI_CORE}"
          echo "============================================"

          # ── Phase 1: Extract ──────────────────────────────────────
          echo ""
          echo "Phase 1: Extracting release..."
          rm -rf "${TMP}"
          mkdir -p "${TMP}"
          tar xzf "/tmp/${RELEASE}.tar.gz" -C "${TMP}"
          echo "  Extracted $(find "${TMP}" -type f | wc -l) files"

          # ── Phase 2: Update application code ──────────────────────
          echo ""
          echo "Phase 2: Updating application code..."

          if [ ! -d "${GHI_CORE}" ]; then
            # First deploy — move directly
            mv "${TMP}" "${GHI_CORE}"
            echo "  Initial deployment to ${GHI_CORE}"
          else
            # Subsequent deploy — remove old code (preserve .env, storage/)
            cd "${GHI_CORE}"
            find . -mindepth 1 -maxdepth 1 \
              ! -name '.env' \
              ! -name 'storage' \
              -exec rm -rf {} + 2>/dev/null || true

            # Move new code in
            cp -a "${TMP}/." "${GHI_CORE}/"
            rm -rf "${TMP}"
            echo "  Updated code in ${GHI_CORE}"
          fi

          # Verify .env exists (user manages this manually)
          if [ ! -f "${GHI_CORE}/.env" ]; then
            echo ""
            echo "FATAL: No .env file at ${GHI_CORE}/.env"
            echo "Create it before deploying."
            exit 1
          fi
          echo "  .env verified"

          # Ensure storage directories exist
          mkdir -p "${GHI_CORE}/storage/app/public"
          mkdir -p "${GHI_CORE}/storage/app/public/images"
          mkdir -p "${GHI_CORE}/storage/app/public/videos"
          mkdir -p "${GHI_CORE}/storage/app/private"
          mkdir -p "${GHI_CORE}/storage/framework/cache"
          mkdir -p "${GHI_CORE}/storage/framework/sessions"
          mkdir -p "${GHI_CORE}/storage/framework/views"
          mkdir -p "${GHI_CORE}/storage/logs"
          mkdir -p "${GHI_CORE}/bootstrap/cache"

          # ── Phase 3: Permissions ───────────────────────────────────
          echo ""
          echo "Phase 3: Setting permissions..."
          chmod -R 777 "${GHI_CORE}/storage" 2>/dev/null || true
          chmod -R 777 "${GHI_CORE}/bootstrap/cache" 2>/dev/null || true
          echo "  storage/ and bootstrap/cache set to 777"

          # ── Phase 4: Composer install ──────────────────────────────
          echo ""
          echo "Phase 4: Installing composer dependencies..."
          cd "${GHI_CORE}"
          composer install \
            --no-dev \
            --optimize-autoloader \
            --prefer-dist \
            --no-progress \
            --no-interaction \
            --ignore-platform-reqs
          echo "  Composer install complete"

          # ── Phase 5: Application setup ─────────────────────────────
          echo ""
          echo "Phase 5: Running application setup..."

          cd "${GHI_CORE}"

          # APP_KEY — only generate if missing
          if grep -qP 'APP_KEY=base64:[A-Za-z0-9+/=]{32,}' "${GHI_CORE}/.env" 2>/dev/null; then
            echo "  APP_KEY exists — skipping"
          else
            echo "  Generating APP_KEY..."
            php artisan key:generate --force
          fi

          # Storage symlink
          rm -f "${GHI_CORE}/public/storage"
          ln -sfn "${GHI_CORE}/storage/app/public" "${GHI_CORE}/public/storage"
          echo "  Storage symlink created"

          # Clear stale caches, then warm fresh
          echo "  Refreshing caches..."
          php artisan config:clear 2>/dev/null || true
          php artisan route:clear 2>/dev/null || true
          php artisan view:clear 2>/dev/null || true
          php artisan cache:clear 2>/dev/null || true
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # Database migrations (safe: only runs new migrations, never alters existing data)
          echo "  Running migrations..."
          php artisan migrate --force --no-interaction 2>&1 || echo "  Migrations completed with warnings (non-fatal)"

          # Migration status (informational)
          php artisan migrate:status 2>/dev/null | head -20 || true

          # Seed database (idempotent)
          echo "  Seeding database..."
          php artisan db:seed --force

          # Backfill media assets (idempotent — safe to run every deploy)
          echo "  Backfilling media assets..."
          php artisan media:backfill 2>&1 || true

          echo "  Application setup complete"

          # ── Phase 6: Web root setup ────────────────────────────────
          echo ""
          echo "Phase 6: Configuring web root..."

          mkdir -p "${WEBROOT}"

          # Create api/ symlink → GHI-core/public
          rm -rf "${WEBROOT}/api"
          ln -sfn "${GHI_CORE}/public" "${WEBROOT}/api"

          # Write .htaccess
          printf '%s\n' \
            'Options +FollowSymLinks -Indexes' \
            '' \
            '# Increase PHP upload limits' \
            'php_value upload_max_filesize 64M' \
            'php_value post_max_size 128M' \
            'php_value max_execution_time 300' \
            'php_value memory_limit 512M' \
            '' \
            '' \
            '' \
            'RewriteEngine On' \
            'RewriteBase /' \
            '' \
            '# Allow well-known verification paths' \
            'RewriteCond %{REQUEST_URI} ^/\.well-known/' \
            'RewriteRule ^ - [L]' \
            '' \
            '# Serve existing files and directories directly' \
            'RewriteCond %{REQUEST_FILENAME} -d' \
            'RewriteRule ^ - [L]' \
            'RewriteCond %{REQUEST_FILENAME} -f' \
            'RewriteRule ^ - [L]' \
            '' \
            '# Serve static assets from GHI-core/public via api/ symlink' \
            'RewriteCond %{DOCUMENT_ROOT}/api/%{REQUEST_URI} -f' \
            'RewriteRule ^ api/%{REQUEST_URI} [L]' \
            '' \
            '# Route everything else through Laravel' \
            'RewriteRule ^ api/index.php [L,QSA]' > "${WEBROOT}/.htaccess"

          # Write entry point
          echo '<?php' > "${WEBROOT}/index.php"
          echo '' >> "${WEBROOT}/index.php"
          echo "require dirname(__DIR__) . '/GHI-core/public/index.php';" >> "${WEBROOT}/index.php"

          echo "  Web root configured"

          # ── Phase 7: Cleanup ───────────────────────────────────────
          echo ""
          echo "Phase 7: Cleaning up..."
          rm -f "/tmp/${RELEASE}.tar.gz"
          find /tmp -maxdepth 1 -name 'ghi-*' -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "  Cleanup complete"

          # ── Phase 8: Verification ──────────────────────────────────
          echo ""
          echo "Phase 8: Verifying deployment..."

          ERRORS=0

          for f in "public/index.php" "bootstrap/app.php" "config/app.php" "routes/web.php" "routes/admin.php" ".env"; do
            if [ ! -f "${GHI_CORE}/${f}" ]; then
              echo "  MISSING: ${GHI_CORE}/${f}"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ ! -d "${GHI_CORE}/vendor" ] || [ ! -f "${GHI_CORE}/vendor/autoload.php" ]; then
            echo "  MISSING: vendor/autoload.php"
            ERRORS=$((ERRORS + 1))
          fi

          if [ ! -d "${GHI_CORE}/public/build" ]; then
            echo "  MISSING: public/build/"
            ERRORS=$((ERRORS + 1))
          fi

          if [ ! -L "${GHI_CORE}/public/storage" ]; then
            echo "  MISSING: public/storage symlink"
            ERRORS=$((ERRORS + 1))
          fi

          if [ ! -L "${WEBROOT}/api" ]; then
            echo "  MISSING: public_html/api symlink"
            ERRORS=$((ERRORS + 1))
          fi

          if [ ! -f "${WEBROOT}/index.php" ]; then
            echo "  MISSING: public_html/index.php"
            ERRORS=$((ERRORS + 1))
          fi

          if [ ! -f "${WEBROOT}/.htaccess" ]; then
            echo "  MISSING: public_html/.htaccess"
            ERRORS=$((ERRORS + 1))
          fi

          if ! grep -qP 'APP_KEY=base64:[A-Za-z0-9+/=]{32,}' "${GHI_CORE}/.env" 2>/dev/null; then
            echo "  WARNING: APP_KEY not found in .env"
            ERRORS=$((ERRORS + 1))
          fi

          if [ ${ERRORS} -gt 0 ]; then
            echo ""
            echo "VERIFICATION FAILED: ${ERRORS} issue(s)"
            exit 1
          fi

          echo "  All checks passed"
          echo ""
          echo "============================================"
          echo "  Deployment complete!"
          echo "============================================"
          SERVER_DEPLOY

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Health check
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 15

          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://globalharmonyinitiative.com/up" || true)

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed (HTTP ${HTTP_STATUS})"
              exit 0
            fi
            echo "Attempt $i: HTTP ${HTTP_STATUS} — retrying in 5s..."
            sleep 5
          done

          echo "::error::Health check failed after 5 attempts (last HTTP ${HTTP_STATUS})"
          exit 1
