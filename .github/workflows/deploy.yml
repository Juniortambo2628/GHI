name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The test job auto-commits Pint/Prettier fixes, so it needs write access.
permissions:
  contents: write

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test-and-fix.yml

  deploy:
    name: Deploy to VPS
    needs: test
    # Also runs on workflow_dispatch so a re-deploy can be triggered by hand
    # (e.g. after rotating PROD_ENV) without pushing an empty commit.
    uses: Juniortambo2628/OKJT/.github/workflows/deploy-laravel.yml@main
    with:
      domain: globalharmonyinitiative.com
      app_name: ghi
      health_path: /up
      # OptimizeImageJob runs on the database queue.
      queue: true
      # No scheduled tasks in routes/console.php.
      scheduler: false
      # Data is imported separately (see MIGRATION_PLAN.md) — don't seed.
      seed: false
      # Idempotent; re-scans uploads into media_assets after each deploy.
      post_migrate: php artisan media:backfill
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      ENV_FILE: ${{ secrets.PROD_ENV }}
