name: Test and Fix

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: write

jobs:
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ghi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo, pdo_mysql, bcmath, gd, fileinfo
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Copy env file
        run: cp .env.example .env 2>/dev/null || echo "APP_KEY=base64:$(openssl rand -base64 32)" > .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Prepare directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs storage/app/public
          chmod -R 775 bootstrap/cache storage

      - name: Run Laravel Pint
        run: ./vendor/bin/pint

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --error-format=github || true
        continue-on-error: true

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

      - name: Auto-commit Pint fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix code style with Pint"
          file_pattern: "*.php"
          commit_user_name: "GitHub Actions"
          commit_user_email: "actions@github.com"

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --fix || true
        continue-on-error: true

      - name: Run Prettier
        run: npx prettier --write "resources/**/*.{js,jsx,css}" || true
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      - name: Auto-commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix frontend code style"
          file_pattern: "resources/**/*.{js,jsx,css}"
          commit_user_name: "GitHub Actions"
          commit_user_email: "actions@github.com"
